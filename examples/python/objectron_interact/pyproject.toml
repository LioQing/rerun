[project]
name = "objectron_interact"
version = "0.1.0"
readme = "README.md"
dependencies = [
  "betterproto[compiler]",
  "grpclib",
  "numpy",
  "opencv-python>4.6",
  "protobuf",
  "requests>=2.31,<3",
  "rerun-sdk",
  "scipy",
  "websockets",
]

[project.scripts]
objectron_interact = "objectron_interact.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
